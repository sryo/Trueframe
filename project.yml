name: Trueframe
options:
  bundleIdPrefix: com.trueframe
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: CL6XWJCS9R
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  Trueframe:
    type: application
    platform: iOS
    sources:
      - path: Trueframe
        excludes:
          - "**/*.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trueframe.app
        INFOPLIST_FILE: Trueframe/Resources/Info.plist
    info:
      path: Trueframe/Resources/Info.plist
      properties:
        CFBundleDisplayName: Trueframe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        NSCameraUsageDescription: "Trueframe captures photos when you cover the proximity sensor"
        NSPhotoLibraryAddUsageDescription: "Photos are saved to your Camera Roll"

  TrueframeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TrueframeTests
    dependencies:
      - target: Trueframe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trueframe.tests
        GENERATE_INFOPLIST_FILE: YES
